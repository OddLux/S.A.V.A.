# SAVA ArtNet / DMX configuration
# ----------------------------------------------------------------------
# Each section is one function. Edit channel numbers to match your console.
#
#   enabled = +     this function/listener is ON
#   enabled = -     this function/listener is OFF
#
# Threshold is the DMX value (0-255) at which trigger functions fire.
# After editing, save the file and use ArtNet -> Reload config in SAVA.

[network]
# Port the listener binds to. 6454 is the ArtNet standard.
port     = 6454
# ArtNet subnet (0-15). Most consoles call this just "subnet".
subnet   = 0
# ArtNet universe within the subnet (0-15).
universe = 1
# Master enable for incoming ArtNet
enabled  = +

# ── Transport ────────────────────────────────────────────────────────
[play]
enabled   = +
channel   = 1
threshold = 128

[pause]
enabled   = +
channel   = 2
threshold = 128

[stop]
enabled   = +
channel   = 3
threshold = 128

[next_track]
enabled   = +
channel   = 4
threshold = 128

[prev_track]
enabled   = +
channel   = 5
threshold = 128

# ── Continuous controls ─────────────────────────────────────────────
# These ignore threshold; they map DMX 0-255 to their full range.

[master_volume]
threshold = 128
enabled = -
channel = 6

[seek]
threshold = 128
enabled = -
channel = 7

# ── Track select ────────────────────────────────────────────────────
# Two channels: an enable toggle, and the track number.
# DMX value on track_select is mapped 0-255 -> 0-100 (matches consoles
# that display percent but output decimal).
# track_select only fires when track_select_enable >= threshold.

[track_select_enable]
enabled   = -
channel   = 8
threshold = 128

[track_select]
threshold = 128
enabled = +
channel = 9

# ── Loop A to B ─────────────────────────────────────────────────────
[loop_ab]
enabled   = +
channel   = 10
threshold = 128

# ── Cue points 1-8 ──────────────────────────────────────────────────
[cue_1]
enabled   = +
channel   = 11
threshold = 128

[cue_2]
enabled   = +
channel   = 12
threshold = 128

[cue_3]
enabled   = +
channel   = 13
threshold = 128

[cue_4]
enabled   = +
channel   = 14
threshold = 128

[cue_5]
enabled   = +
channel   = 15
threshold = 128

[cue_6]
enabled   = +
channel   = 16
threshold = 128

[cue_7]
enabled   = +
channel   = 17
threshold = 128

[cue_8]
enabled   = +
channel   = 18
threshold = 128
